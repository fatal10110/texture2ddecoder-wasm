name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Path filters live here, not in `on.paths`: a workflow skipped by `paths` never reports
  # its checks, so required status checks would hang. A job skipped by `if` reports success.
  changes:
    runs-on: ubuntu-latest
    outputs:
      reader: ${{ steps.filter.outputs.reader }}
      decoder: ${{ steps.filter.outputs.decoder }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: |
          # Pushes to main always run everything.
          if [ "$EVENT" != "pull_request" ]; then
            echo "reader=true" >> "$GITHUB_OUTPUT"
            echo "decoder=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE...$HEAD")
          if echo "$files" | grep -qE '^(packages/(core|texture|node)/|fixtures/|scripts/|\.github/|package(-lock)?\.json$|tsconfig[^/]*\.json$|rollup\.reader\.mjs$)'; then
            echo "reader=true" >> "$GITHUB_OUTPUT"
          else
            echo "reader=false" >> "$GITHUB_OUTPUT"
          fi
          # The decoder job also runs the texture package's decode tests (#119) and the
          # examples/ smoke test (#35), so it runs for what they build from: core, texture,
          # fixtures, the reader build config and the examples.
          if echo "$files" | grep -qE '^(packages/(decoder|core|texture)/|fixtures/|examples/|\.github/|package(-lock)?\.json$|tsconfig[^/]*\.json$|rollup\.reader\.mjs$)'; then
            echo "decoder=true" >> "$GITHUB_OUTPUT"
          else
            echo "decoder=false" >> "$GITHUB_OUTPUT"
          fi

  # Build every package (TS only), test, browser guard, no-C# guard. No submodules, no Docker.
  reader:
    name: reader (node ${{ matrix.node }})
    needs: changes
    if: needs.changes.outputs.reader == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify

  # Rebuilds the WASM (Docker, needs the C++ submodule) and runs the decoder tests, then the
  # texture package's tests, whose decode tests need that WASM and skip in `reader` (#119),
  # then the examples/cdn.html smoke test in Chromium (#35).
  decoder:
    name: decoder
    needs: changes
    if: needs.changes.outputs.decoder == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:wasm
      - run: npm run build:rollup
      - run: npm test -w texture2ddecoder-wasm
      - run: npm run build -w unity-asset-reader
      # REQUIRE_WASM=1: a missing WASM fails decode.test.ts instead of skipping it.
      - run: npm test -w unity-asset-reader-texture
        env:
          REQUIRE_WASM: "1"
      # The examples/cdn.html smoke test (#35). It runs here because initTexture loads
      # the WASM even for a plain-format texture, and this is the job that builds it.
      # Core and texture dist/ come from the steps above.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: examples/test-results/
          if-no-files-found: ignore
