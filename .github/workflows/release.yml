name: Release

# Publishes one release family with npm trusted publishing (#175, #182). There are two, each
# with its own version line and tag:
#   unity-asset-reader@<version>     unity-asset-reader, -texture, -node (lockstep)
#   texture2ddecoder-wasm@<version>  the decoder
# The procedure, the one-time npm setup and the bootstrap of the first publish are in
# RELEASING.md. npm matches
# the trusted publisher on this file's name: renaming release.yml breaks publishing until each
# package's trusted-publisher entry on npmjs.com is updated to the new name.

on:
  push:
    tags: ["unity-asset-reader@*.*.*", "texture2ddecoder-wasm@*.*.*"]
  workflow_dispatch:
    inputs:
      family:
        description: "Which release family (on a tag, it must be the tag's)"
        type: choice
        options: ["unity-asset-reader", "texture2ddecoder-wasm"]
        default: "unity-asset-reader"
      dry_run:
        description: "Run everything but publish with `npm publish --dry-run`"
        type: boolean
        default: true

# id-token: write lets npm exchange the job's OIDC token for a publish token and sign the
# provenance. contents: read only: the GitHub release is created by hand (RELEASING.md).
permissions:
  contents: read
  id-token: write

# Never two publishes of one ref at a time; never cancel one halfway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # A real publish runs in the `npm` environment, whose deployment rule admits only the two
    # release tag patterns above. Each package's trusted publisher on npm names this environment, so an OIDC token from
    # any other ref (a branch that edits its own copy of this file, a PR run) is refused by npm,
    # and NPM_BOOTSTRAP_TOKEN is a secret of this environment only. Dry runs use no environment,
    # so they still run on any branch. Must stay in step with DRY_RUN below.
    environment: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'npm' || '' }}
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      # The texture decode tests fail instead of skipping when the WASM is missing. Also set for
      # the full verify that each reader package's prepublishOnly reruns.
      REQUIRE_WASM: "1"
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.0
      # (https://docs.npmjs.com/trusted-publishers). setup-node's `22` is the latest 22.x.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install npm 11
        run: |
          npm install -g npm@^11.5.1
          node -e 'const [a, b] = process.versions.node.split(".").map(Number);
            if (a < 22 || (a === 22 && b < 14)) throw new Error("Node " + process.version + " < 22.14.0");'
          echo "node $(node --version), npm $(npm --version)"

      # Before anything is built: a wrong tag, a half-bumped release, or readers whose decoder
      # range is not on npm yet stop here. A real publish needs a tag; a dry run off a branch
      # checks the chosen family's versions. Outputs family, version and packages (publish order).
      - name: Version guard
        id: guard
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          FAMILY: ${{ inputs.family }}
        run: |
          if [ "$DRY_RUN" != "true" ] && [ "$REF_TYPE" != "tag" ]; then
            echo "::error::A real publish runs only from a release tag; this is $REF_TYPE $REF_NAME."
            exit 1
          fi
          args=()
          if [ "$REF_TYPE" = "tag" ]; then args+=("$REF_NAME"); fi
          if [ "$EVENT" = "workflow_dispatch" ]; then args+=(--family "$FAMILY"); fi
          release=$(node scripts/check-release.mjs "${args[@]}")
          echo "$release" >> "$GITHUB_OUTPUT"
          echo "$release"
          echo "Dry run: $DRY_RUN"

      # The gate: the same checks as CI's reader and decoder jobs, with the WASM built from the
      # pinned emsdk (#57), since the decoder tarball ships it.
      - run: npm ci
      - run: npm run build:wasm
      - run: npm run verify
      - run: npm test -w texture2ddecoder-wasm

      # The family's packages in dependency order (core, then the packages that peer on it).
      # A name@version already on npm is skipped, so a run that failed halfway can be re-run.
      # No token: npm authenticates with the job's OIDC token and adds provenance by itself.
      # NPM_BOOTSTRAP_TOKEN (a secret of the `npm` environment) exists only for the one-time
      # bootstrap in RELEASING.md.
      - name: Publish
        env:
          VERSION: ${{ steps.guard.outputs.version }}
          PACKAGES: ${{ steps.guard.outputs.packages }}
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          if [ -n "$NPM_BOOTSTRAP_TOKEN" ]; then
            echo "::warning::NPM_BOOTSTRAP_TOKEN is set; delete it once trusted publishing is set up."
            echo "//registry.npmjs.org/:_authToken=\${NPM_BOOTSTRAP_TOKEN}" > "$HOME/.npmrc"
          fi
          dry=()
          if [ "$DRY_RUN" = "true" ]; then dry=(--dry-run); fi
          for pkg in $PACKAGES; do
            published=$(npm view "$pkg@$VERSION" version 2>/dev/null || true)
            if [ "$published" = "$VERSION" ]; then
              echo "::notice::$pkg@$VERSION is already on npm, skipping."
              continue
            fi
            npm publish -w "$pkg" --access public "${dry[@]}"
          done
